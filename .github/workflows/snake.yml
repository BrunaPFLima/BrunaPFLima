name: Cobrinha roxa 💜

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6A0DAD&color_dots=#EDE4F7,#E0AAFF,#C77DFF,#9D4EDD,#6A0DAD
            dist/snake-dark.svg?palette=github-dark&color_snake=#E0AAFF&color_dots=#1A0B2E,#3C1361,#6A0DAD,#9D4EDD,#C77DFF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
